[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "potenzial-engine"
version = "0.1.0"
description = "Grundstuecks-Potenzialanalyse Schweiz (Geodaten, BZO, G1, SIA 416)"
requires-python = ">=3.11"
dependencies = [
    "requests",
    "shapely",
    # Modul 2 wertet die Bau- und Nutzungsordnung per LLM aus. Ohne dieses
    # Paket startet der Dienst zwar, aber JEDE Analyse scheitert an derselben
    # Stelle -- im Container faellt das sonst erst beim ersten Nutzer auf.
    "google-genai",
]

[tool.setuptools]
packages = ["potenzial_engine"]
